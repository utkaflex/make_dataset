<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Рукописная выборка</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Рукописная выборка</div>
    <nav aria-label="Разделы">
      <button id="draw-tab" aria-current="page">Рисование</button>
      <button id="gallery-tab">Галерея</button>
    </nav>
    <label class="theme"><span>Тема</span>
      <select id="theme"><option value="system">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select>
    </label>
  </header>
  <main>
    <section class="progress-panel" aria-label="Общий прогресс">
      <div><span>Готово</span><strong id="count">0 / 108</strong></div>
      <progress id="progress" value="0" max="108" aria-label="Готовые образы"></progress>
    </section>
    <p id="error" role="alert" hidden></p>
    <p id="announcement" class="sr-only" role="status"></p>
    <section id="workspace" class="workspace" inert>
      <div class="drawing">
        <div class="canvas-frame"><canvas id="pad" width="768" height="768" aria-label="Холст для рисования"></canvas></div>
      </div>
      <aside class="controls">
        <div class="task">
          <div id="symbol">A</div>
          <div><h1 id="variant">Вариант 1 / 3</h1><p id="sample-state">Новый образ</p></div>
        </div>
        <div class="settings">
          <label class="field">Цвет кисти <input id="ink" type="color" value="#171923"></label>
          <label class="field">Цвет фона <input id="background" type="color" value="#ffffff"></label>
          <label class="field">Толщина кисти <output id="width-value" for="width">7</output></label>
          <input id="width" type="range" min="1" max="24" value="7" aria-label="Толщина кисти">
          <label class="field pencil">Только Apple Pencil <input id="pencil" type="checkbox" role="switch"></label>
        </div>
        <div class="actions">
          <div class="pair"><button id="undo">Отменить штрих</button><button id="clear">Очистить</button></div>
          <button id="save" class="primary">Сохранить и далее</button>
          <button id="previous">Предыдущий образ</button>
        </div>
      </aside>
    </section>
    <section id="gallery" hidden>
      <div class="gallery-header"><h1>Галерея</h1><div class="exports">
        <button id="backup">Резервный ZIP</button><button id="final" class="primary">Скачать итоговый ZIP</button>
      </div></div>
      <div id="grid" class="grid"></div>
      <footer><button id="reset" class="danger">Сбросить выборку</button></footer>
    </section>
  </main>
</body>
</html>
